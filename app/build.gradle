plugins {
    id 'com.android.application'
}

// Release signing comes from keystore.properties (not in git). Without it, release builds are unsigned.
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace = 'dev.ayushvarma.aperture'
    compileSdk = 37

    defaultConfig {
        applicationId = 'dev.ayushvarma.aperture'
        minSdk = 34
        targetSdk = 37
        versionCode = 1
        versionName = '1.0.0'
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile = file(keystore['storeFile'])
                storePassword = keystore['storePassword']
                keyAlias = keystore['keyAlias']
                keyPassword = keystore['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            if (keystoreFile.exists()) signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
}

tasks.withType(JavaCompile).configureEach { options.compilerArgs << '-Xlint:deprecation' }
